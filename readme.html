<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Read Me Fitur</title>
    <link rel="icon" type="image/png" href="assets/images/logo-IT.png" />
    <link rel="stylesheet" href="styles.css" />
    <style>
                  .tab-content {
                    padding: 0;
                    margin: 0;
                  }
                  .pdf-viewer {
                    width: 99vw;
                    max-width: 99vw;
                    height: 90vh;
                    border: none;
                    display: block;
                    margin: 0;
                  }
            .btn-fullscreen {
              background: #2563eb;
              color: #fff;
              border: none;
              border-radius: 6px;
              padding: 8px 20px;
              font-size: 1rem;
              font-weight: 500;
              cursor: pointer;
              box-shadow: 0 2px 8px rgba(37,99,235,0.08);
              transition: background 0.2s, box-shadow 0.2s;
            }
            .btn-fullscreen:hover {
              background: #1746a0;
              box-shadow: 0 4px 16px rgba(37,99,235,0.18);
            }
      .tab-container .tabs {
        background: #f7f7f7;
        border-radius: 12px 12px 0 0;
        padding: 0 0.5rem;
        display: flex;
        gap: 0.5rem;
        border-bottom: 1.5px solid #e0e7ef;
      }
      .tab {
        background: transparent;
        border: none;
        outline: none;
        font-size: 1.08rem;
        font-weight: 500;
        color: #333;
        padding: 1rem 2rem 0.7rem 2rem;
        border-radius: 12px 12px 0 0;
        cursor: pointer;
        transition: color 0.2s, background 0.2s;
        position: relative;
      }
      .tab.active {
        color: #2563eb;
        background: #fff;
        box-shadow: 0 -2px 0 0 #2563eb inset;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <!-- Hero Section -->
    <section class="hero" style="margin-bottom: 2rem">
      <div class="hero-content" style="max-width: 100%; width: 100%">
        <div class="readme-header-grid">
          <button
            onclick="window.location.href='index.html'"
            class="btn-dashboard"
          >
            Kembali ke Dashboard
          </button>
          <div class="readme-header-center">
            <h1 id="feature-title">Read Me</h1>
            <p id="feature-desc">
              Detail dokumentasi fitur aplikasi RS JHC Tasikmalaya.
            </p>
          </div>
          <div></div>
        </div>
      </div>
    </section>
    <div class="container" style="margin-top: -40px">
      <div
        class="feature-card"
        style="max-width: 100%; width: 100%; margin: 0 auto"
      >
        <div class="tab-container">
          <div class="tabs">
            <button class="tab active" onclick="showTab('informasi')">
              Informasi
            </button>
            <button class="tab" onclick="showTab('spo')">SPO (PDF)</button>
          </div>
          <div class="tab-content" id="tab-informasi">
            <div style="text-align:right; margin-bottom:8px;">
              <button onclick="fullscreenPDF('informasi-pdf')" class="btn-fullscreen">Fullscreen</button>
            </div>
            <iframe
              class="pdf-viewer"
              id="informasi-pdf"
              type="application/pdf"
              style="width: 100%; height: 768px; border: none"
            ></iframe>
              </button>
            </div>
          </div>
          <div class="tab-content" id="tab-spo" style="display: none">
            <div style="text-align:right; margin-bottom:8px;">
              <button onclick="fullscreenPDF('spo-pdf')" class="btn-fullscreen">Fullscreen</button>
            </div>
            <iframe
              class="pdf-viewer"
              id="spo-pdf"
              type="application/pdf"
              style="width: 100%; height: 768px; border: none"
            ></iframe>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Footer -->
    <footer class="footer" id="contact" style="margin-top: 2rem">
      <div class="container">
        <div class="footer-content">
          <div class="footer-section">
            <h4>Tentang DASHBOARD JHC APP</h4>
            <p>
              Platform Manajemen Aplikasi Terintegrasi yang dikembangkan oleh
              Tim IT RS JHC Tasikmalaya
            </p>
          </div>
          <div class="footer-section">
            <h4>Kontak</h4>
            <p>Email: it_rsjhc@gmail.com</p>
          </div>
          <div class="footer-section">
            <h4>Media Sosial</h4>
            <div class="social-icons">
              <a href="#"><i class="fab fa-facebook"></i></a>
              <a href="#"><i class="fab fa-twitter"></i></a>
            </div>
          </div>
        </div>
        <div class="footer-bottom">
          <p>&copy; 2025 IT RS JHC TASIKMALAYA. All rights reserved.</p>
        </div>
      </div>
    </footer>
    <script>
      // Fungsi untuk fullscreen PDF
      function fullscreenPDF(id) {
        var iframe = document.getElementById(id);
        if (iframe.requestFullscreen) {
          iframe.requestFullscreen();
        } else if (iframe.mozRequestFullScreen) {
          iframe.mozRequestFullScreen();
        } else if (iframe.webkitRequestFullscreen) {
          iframe.webkitRequestFullscreen();
        } else if (iframe.msRequestFullscreen) {
          iframe.msRequestFullscreen();
        }
      }
      // Tab logic
      function showTab(tab) {
        document
          .querySelectorAll(".tab")
          .forEach((btn) => btn.classList.remove("active"));
        document
          .querySelectorAll(".tab-content")
          .forEach((tc) => (tc.style.display = "none"));
        document
          .querySelector(".tab[onclick=\"showTab('" + tab + "')\"]")
          .classList.add("active");
        document.getElementById("tab-" + tab).style.display = "block";
      }

      // Get feature from URL
      function getFeatureName() {
        const params = new URLSearchParams(window.location.search);
        return params.get("feature") || "Fitur";
      }

      // Set feature title dan isi tab
      const feature = getFeatureName();
      document.getElementById("feature-title").textContent =
        "Read Me: " + feature;

      // Isi tab sesuai fitur
      function setTabContent() {
        // Nama file PDF diambil dari nama fitur
        const pdfName = feature + ".pdf";
        // Tab Informasi
        document.getElementById("informasi-pdf").src = `assets/pdf/informasi/${pdfName}#toolbar=0`;
        // Tab SPO
        document.getElementById("spo-pdf").src = `assets/pdf/spo/${pdfName}#toolbar=0`;
      }
      setTabContent();
    </script>
  </body>
</html>
